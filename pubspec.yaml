name: learning_calculator
description: An offline-first learning calculator for grades 3–5.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  connectivity_plus: ^6.1.4
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path: ^1.9.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
